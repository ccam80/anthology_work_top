<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract Income Calculator</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3ef;
  --surface-1: #fcfcfb;
  --border: #dddcd6;
  --grid: #e8e7e2;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --net: #2a78d6;
  --band: rgba(42, 120, 214, 0.16);
  --tax: #eb6834;
  --base: #b9b8b1;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #34332f;
    --grid: #2a2a27;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --net: #3987e5;
    --band: rgba(57, 135, 229, 0.22);
    --tax: #d95926;
    --base: #5a5954;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --border: #34332f;
  --grid: #2a2a27;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --net: #3987e5;
  --band: rgba(57, 135, 229, 0.22);
  --tax: #d95926;
  --base: #5a5954;
  --accent: #3987e5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 16px; }
.inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 20px; }
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}
.card + .card { margin-top: 16px; }
.card h2 { font-size: 15px; margin: 20px 0 4px; }
.card .legend + h2 { margin-top: 8px; }
.ctl { margin-bottom: 16px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--text-secondary); }
.ctl label b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
.ctl .hint { font-size: 12px; color: var(--text-muted); }
.ctl input[type=number] {
  width: 100%; margin-top: 4px; padding: 6px 8px; font: inherit;
  background: var(--surface-0); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px;
}
.fxpresets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fxpresets button {
  font: 12px system-ui, sans-serif; padding: 3px 8px; cursor: pointer;
  background: var(--surface-0); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
}
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
.tile .k { font-size: 12px; color: var(--text-secondary); }
.tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
tr.total td { font-weight: 650; border-bottom: none; }
td.neg { color: var(--text-secondary); }
.tablewrap { overflow-x: auto; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.line { height: 3px; border-radius: 2px; }
.tip {
  position: absolute; pointer-events: none; opacity: 0;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12); transition: opacity 0.08s;
  font-variant-numeric: tabular-nums;
}
.tip .t { color: var(--text-secondary); margin-bottom: 2px; }
svg text { fill: var(--text-secondary); font: 11px system-ui, sans-serif; }
svg .axis line, svg .gridline { stroke: var(--grid); }
</style>
</head>
<body>
<main>
  <h1>Contract income: what it adds after tax</h1>

  <div class="card inputs">
    <div class="ctl">
      <label for="hours">Hours per week <b id="hoursOut"></b></label>
      <input id="hours" type="range" min="0" max="40" step="0.5" value="10">
    </div>
    <div class="ctl">
      <label for="fx">USD → NZD rate <b id="fxOut"></b></label>
      <input id="fx" type="range" min="1.55" max="1.90" step="0.005" value="1.70">
      <div class="fxpresets">
        <button data-fx="1.64">Low 1.64</button>
        <button data-fx="1.71">Avg 1.71</button>
        <button data-fx="1.78">High 1.78</button>
      </div>
    </div>
    <div class="ctl">
      <label for="weeks">Weeks worked per year <b id="weeksOut"></b></label>
      <input id="weeks" type="range" min="40" max="52" step="1" value="48">
    </div>
    <div class="ctl">
      <label for="rate">Hourly rate (USD)</label>
      <input id="rate" type="number" min="0" step="1" value="70">
    </div>
    <div class="ctl">
      <label for="base">Current salary (NZD per year)</label>
      <input id="base" type="number" min="0" step="500" value="38000">
    </div>
    <div class="ctl">
      <label for="fb">FamilyBoost now (NZD per quarter)</label>
      <input id="fb" type="number" min="0" max="1560" step="10" value="1400">
    </div>
  </div>

  <div class="card">
    <div class="tiles">
      <div class="tile"><div class="k">Net per week</div><div class="v" id="tWeek"></div><div class="s" id="tWeekS"></div></div>
      <div class="tile"><div class="k">Net per month</div><div class="v" id="tMonth"></div><div class="s" id="tMonthS"></div></div>
      <div class="tile"><div class="k">Net per year</div><div class="v" id="tYear"></div><div class="s" id="tYearS"></div></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Contract income</th><th>Per week</th><th>Per month</th><th>Per year</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="legend">
      <span><i class="sw line" style="background:var(--net)"></i>Net at selected rate</span>
      <span><i class="sw" style="background:var(--band)"></i>Net across the 2026 rate range (1.64 to 1.78)</span>
      <span><i class="sw line" style="background:var(--tax)"></i>Gross income</span>
      <span><i class="sw line" style="background:var(--text-muted)"></i>Tax bracket or threshold crossed</span>
    </div>
    <h2>Net income by hours per week</h2>
    <div class="chart" id="lineChart"><div class="tip"></div></div>
  </div>
</main>

<script>
const BRACKETS = [
  { top: 15600, rate: 0.105 },
  { top: 53500, rate: 0.175 },
  { top: 78100, rate: 0.30 },
  { top: 180000, rate: 0.33 },
  { top: Infinity, rate: 0.39 },
];
const ACC_RATE = 0.0175, ACC_CAP = 156641;
const SL_RATE = 0.12, SL_THRESHOLD = 24128;
const FX_LOW = 1.64, FX_HIGH = 1.78;
const FB_ABATEMENT = 0.07;

const $ = id => document.getElementById(id);
const nzd = new Intl.NumberFormat("en-NZ", { style: "currency", currency: "NZD", maximumFractionDigits: 0 });
const pct = v => (v * 100).toFixed(1) + "%";

function incomeTax(income) {
  let tax = 0, lower = 0;
  for (const b of BRACKETS) {
    if (income <= lower) break;
    tax += (Math.min(income, b.top) - lower) * b.rate;
    lower = b.top;
  }
  return tax;
}
function ietc(income) {
  if (income < 24000 || income > 70000) return 0;
  return Math.max(0, 520 - Math.max(0, income - 66000) * 0.13);
}
function deductions(income) {
  return {
    tax: incomeTax(income),
    credit: ietc(income),
    acc: Math.min(income, ACC_CAP) * ACC_RATE,
    sl: Math.max(0, income - SL_THRESHOLD) * SL_RATE,
  };
}
function netIncome(income) {
  const d = deductions(income);
  return income - d.tax + d.credit - d.acc - d.sl;
}

function readState() {
  return {
    hours: +$("hours").value,
    fx: +$("fx").value,
    weeks: +$("weeks").value,
    rate: Math.max(0, +$("rate").value || 0),
    base: Math.max(0, +$("base").value || 0),
    fb: Math.max(0, +$("fb").value || 0) * 4,
  };
}

// Return the incremental annual figures from adding the contract to the salary.
function contribution(s, hours = s.hours, fx = s.fx) {
  const gross = s.rate * hours * s.weeks * fx;
  const before = deductions(s.base), after = deductions(s.base + gross);
  const tax = after.tax - before.tax, creditLost = before.credit - after.credit;
  // FamilyBoost falls by 7c per dollar of household income until none is left.
  const fbLost = Math.min(s.fb, gross * FB_ABATEMENT);
  const acc = after.acc - before.acc, sl = after.sl - before.sl;
  return { gross, tax, creditLost, acc, sl, fbLost, net: gross - tax - creditLost - acc - sl - fbLost };
}

function renderTable(s, c) {
  const per = v => [v / 52, v / 12, v];
  const rows = [
    ["Gross (USD)", per(s.rate * s.hours * s.weeks).map(v => "US" + nzd.format(v)), ""],
    ["Gross (NZD)", per(c.gross).map(nzd.format), ""],
    ["Income tax", per(-c.tax).map(nzd.format), "neg"],
    ["Independent earner tax credit lost", per(-c.creditLost).map(nzd.format), "neg"],
    ["ACC earners' levy", per(-c.acc).map(nzd.format), "neg"],
    ["Student loan", per(-c.sl).map(nzd.format), "neg"],
    ["FamilyBoost lost", per(-c.fbLost).map(nzd.format), "neg"],
  ];
  $("tbody").innerHTML = rows.map(([k, v, cls]) =>
    `<tr><td>${k}</td>${v.map(x => `<td class="${cls}">${x}</td>`).join("")}</tr>`).join("") +
    `<tr class="total"><td>Net</td>${per(c.net).map(v => `<td>${nzd.format(v)}</td>`).join("")}</tr>`;
}

function renderTiles(s, c) {
  const baseNet = netIncome(s.base);
  $("tWeek").textContent = nzd.format(c.net / 52);
  $("tWeekS").textContent = `${nzd.format(c.gross / 52)} gross`;
  $("tMonth").textContent = nzd.format(c.net / 12);
  $("tMonthS").textContent = `${nzd.format(c.gross / 12)} gross`;
  $("tYear").textContent = nzd.format(c.net);
  $("tYearS").textContent = `${nzd.format(c.gross)} gross. Total net income ${nzd.format(baseNet + c.net)}, ${nzd.format((baseNet + c.net) / 52)} per week.`;
}

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function niceStep(max, ticks) {
  const raw = max / ticks, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => st >= raw);
}
const kfmt = v => v >= 1000 ? "$" + (v / 1000).toLocaleString("en-NZ", { maximumFractionDigits: 1 }) + "k" : "$" + v;

// Return the share of the next contract dollar lost to deductions at a number of hours.
function marginalRate(s, hours) {
  const a = contribution(s, hours), b = contribution(s, hours + 0.01);
  return 1 - (b.net - a.net) / (b.gross - a.gross);
}

function renderLine(s) {
  const host = $("lineChart"), tip = host.querySelector(".tip");
  host.querySelector("svg")?.remove();
  const W = 1000, H = 600, m = { l: 56, r: 56, t: 56, b: 34 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const baseNet = netIncome(s.base);
  const hs = []; for (let i = 0; i <= 400; i++) hs.push(i / 10);
  const pts = hs.map(h => ({
    h,
    gross: s.base + contribution(s, h).gross,
    net: baseNet + contribution(s, h).net,
    lo: baseNet + contribution(s, h, FX_LOW).net,
    hi: baseNet + contribution(s, h, FX_HIGH).net,
  }));
  const ymax = Math.max(...pts.map(p => Math.max(p.gross, p.hi)));
  const step = niceStep(ymax - baseNet, 10);
  const bottom = Math.floor(baseNet / step) * step, top = Math.ceil(ymax / step) * step;
  const x = h => m.l + (h / 40) * iw, y = v => m.t + ih - ((v - bottom) / (top - bottom)) * ih;

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Net income against hours per week" });
  for (let v = bottom; v <= top + 1e-9; v += step) {
    el("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }, svg);
    el("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = kfmt(v);
  }
  // Tick the right axis at round weekly amounts, placed at 52 times their value on the annual scale.
  const wstep = niceStep((top - bottom) / 52, 10);
  for (let w = Math.ceil(bottom / 52 / wstep) * wstep; w * 52 <= top + 1e-9; w += wstep)
    el("text", { x: W - m.r + 8, y: y(w * 52) + 4, "text-anchor": "start" }, svg).textContent = kfmt(w);
  el("text", { x: m.l - 8, y: m.t - 36, "text-anchor": "end" }, svg).textContent = "Per year";
  el("text", { x: W, y: m.t - 36, "text-anchor": "end" }, svg).textContent = "Per week";
  for (let h = 0; h <= 40; h += 5)
    el("text", { x: x(h), y: H - m.b + 18, "text-anchor": "middle" }, svg).textContent = h;
  el("text", { x: m.l + iw / 2, y: H - 2, "text-anchor": "middle" }, svg).textContent = "Hours per week";

  // Mark the hours at which total income crosses a bracket edge or the ACC cap.
  // Shade the band where the independent earner tax credit is withdrawn.
  const hoursAt = income => (income - s.base) / (s.rate * s.weeks * s.fx);
  const pa = Math.max(0, hoursAt(66000)), pb = Math.min(40, hoursAt(70000));
  if (pb > pa) {
    el("rect", { x: x(pa), y: m.t, width: x(pb) - x(pa), height: ih, fill: "var(--tax)", opacity: 0.1 }, svg);
    el("text", { x: (x(pa) + x(pb)) / 2, y: m.t - 8, "text-anchor": "middle" }, svg).textContent = "IETC lost";
  }
  // Put bracket labels on a higher row than the other thresholds so nearby labels do not overlap.
  const marks = BRACKETS.slice(0, -1).map((b, i) => ({ at: b.top, label: pct(BRACKETS[i + 1].rate).replace(".0", ""), row: 1 }))
    .concat([{ at: ACC_CAP, label: "ACC cap", row: 0 }, { at: s.base + s.fb / FB_ABATEMENT, label: "FamilyBoost gone", row: 0 }]);
  for (const mk of marks) {
    const h = hoursAt(mk.at);
    if (!(h > 0 && h < 40)) continue;
    el("line", { x1: x(h), x2: x(h), y1: m.t, y2: m.t + ih, stroke: "var(--text-muted)", "stroke-dasharray": "1 3" }, svg);
    el("text", { x: x(h), y: m.t - 8 - 14 * mk.row, "text-anchor": "middle" }, svg).textContent = mk.label;
  }

  const band = pts.map(p => `${x(p.h)},${y(p.hi)}`).concat(pts.slice().reverse().map(p => `${x(p.h)},${y(p.lo)}`));
  el("polygon", { points: band.join(" "), fill: "var(--band)" }, svg);
  const path = f => "M" + pts.map(p => `${x(p.h)},${y(f(p))}`).join("L");
  el("path", { d: path(p => p.gross), fill: "none", stroke: "var(--tax)", "stroke-width": 2, "stroke-dasharray": "5 4" }, svg);
  el("path", { d: path(p => p.net), fill: "none", stroke: "var(--net)", "stroke-width": 2 }, svg);

  const curNet = baseNet + contribution(s).net;
  el("line", { x1: x(s.hours), x2: x(s.hours), y1: m.t, y2: m.t + ih, stroke: "var(--text-muted)", "stroke-width": 1 }, svg);
  el("circle", { cx: x(s.hours), cy: y(curNet), r: 5, fill: "var(--net)", stroke: "var(--surface-1)", "stroke-width": 2 }, svg);

  const cross = el("line", { y1: m.t, y2: m.t + ih, stroke: "var(--text-muted)", "stroke-dasharray": "2 3", opacity: 0 }, svg);
  const dot = el("circle", { r: 4, fill: "var(--net)", stroke: "var(--surface-1)", "stroke-width": 2, opacity: 0 }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), sx = W / r.width;
    const hx = ((ev.clientX - r.left) * sx - m.l) / iw * 40;
    const p = pts[Math.max(0, Math.min(pts.length - 1, Math.round(hx * 10)))];
    cross.setAttribute("x1", x(p.h)); cross.setAttribute("x2", x(p.h)); cross.setAttribute("opacity", 1);
    dot.setAttribute("cx", x(p.h)); dot.setAttribute("cy", y(p.net)); dot.setAttribute("opacity", 1);
    tip.innerHTML = `<div class="t">${p.h} hours per week</div>
      Net ${nzd.format(p.net)} a year, ${nzd.format(p.net / 52)} a week<br>
      Gross ${nzd.format(p.gross)} a year, ${nzd.format(p.gross / 52)} a week<br>
      Net at 1.64 to 1.78: ${nzd.format(p.lo)} to ${nzd.format(p.hi)} a year<br>
      Deductions on the next dollar: ${pct(marginalRate(s, p.h))}`;
    tip.style.opacity = 1;
    const px = x(p.h) / sx, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, px + 12), r.width - tw) + "px";
    tip.style.top = (y(p.net) / sx - tip.offsetHeight - 12) + "px";
  });
  hit.addEventListener("pointerleave", () => {
    tip.style.opacity = 0; cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0);
  });
  hit.addEventListener("click", () => {
    const h = +tip.querySelector(".t")?.textContent.split(" ")[0];
    if (!isNaN(h)) { $("hours").value = h; update(); }
  });
  host.prepend(svg);
}

function update() {
  const s = readState();
  $("hoursOut").textContent = s.hours + " h";
  $("fxOut").textContent = s.fx.toFixed(3);
  $("weeksOut").textContent = s.weeks;
  const c = contribution(s);
  renderTiles(s, c);
  renderTable(s, c);
  renderLine(s);
}

document.querySelectorAll("input").forEach(i => i.addEventListener("input", update));
document.querySelectorAll(".fxpresets button").forEach(b =>
  b.addEventListener("click", () => { $("fx").value = b.dataset.fx; update(); }));
update();
</script>
</body>
</html>
